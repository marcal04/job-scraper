<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Scraper — Vagas de Dev</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f0f2f5;
            color: #333;
        }

        header {
            background: #1a1a2e;
            color: white;
            padding: 24px;
            text-align: center;
        }

        header h1 { font-size: 24px; margin-bottom: 4px; }
        header p  { font-size: 14px; color: #aaa; }

        .search-area {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 24px;
        }

        .search-area input {
            width: 400px;
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        .search-area input:focus { border-color: #4a6cf7; }

        .search-area button {
            padding: 12px 24px;
            background: #4a6cf7;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
        }

        .search-area button:hover { background: #3a5ce7; }

        #status {
            text-align: center;
            color: #888;
            font-size: 14px;
            margin-bottom: 16px;
        }

        #results {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 24px 40px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .job-card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
            transition: transform 0.1s;
        }

        .job-card:hover { transform: translateY(-2px); }

        .job-card h3 {
            font-size: 16px;
            margin-bottom: 6px;
            color: #1a1a2e;
        }

        .job-card .meta {
            font-size: 13px;
            color: #666;
            margin-bottom: 12px;
        }

        .job-card .meta span { margin-right: 16px; }

        .job-card a {
            font-size: 13px;
            color: #4a6cf7;
            text-decoration: none;
            font-weight: 500;
        }

        .job-card a:hover { text-decoration: underline; }

        .badge {
            display: inline-block;
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 20px;
            background: #eef0ff;
            color: #4a6cf7;
            margin-left: 8px;
            font-weight: 500;
        }
    </style>
</head>
<body>

<header>
    <h1>🔍 Job Scraper</h1>
    <p>Vagas de desenvolvimento agregadas automaticamente</p>
</header>

<div class="search-area">
    <input
            type="text"
            id="searchInput"
            placeholder="Ex: java, react, python..."
            value="java"
    />
    <button onclick="buscar()">Buscar Vagas</button>
</div>

<div id="status"></div>
<div id="results"></div>

<script>

    buscar();

    async function buscar() {
        const term = document.getElementById('searchInput').value.trim();

        if (!term) return;


        document.getElementById('status').textContent = 'Buscando vagas...';
        document.getElementById('results').innerHTML = '';

        try {

            const response = await fetch(`/api/jobs?term=${encodeURIComponent(term)}`);
            const jobs = await response.json();

            document.getElementById('status').textContent =
                `${jobs.length} vagas encontradas para "${term}"`;


            const container = document.getElementById('results');
            jobs.forEach(job => {
                container.innerHTML += `
                    <div class="job-card">
                        <h3>
                            ${job.title}
                            <span class="badge">${job.source}</span>
                        </h3>
                        <div class="meta">
                            <span>🏢 ${job.company}</span>
                            <span>📍 ${job.location || 'Não informado'}</span>
                        </div>
                        <a href="${job.url}" target="_blank">
                            Ver vaga →
                        </a>
                    </div>
                `;
            });

        } catch (error) {
            document.getElementById('status').textContent =
                'Erro ao buscar vagas. Verifique se a API está rodando.';
        }
    }


    document.getElementById('searchInput')
        .addEventListener('keypress', function(e) {
            if (e.key === 'Enter') buscar();
        });
</script>

</body>
</html>
